<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#1d1d1d">
    <meta name="description" content="Suraj Dash’s cinema collection and watchlist.">
    <title>Cinema | Suraj Dash</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body id="top">
    <a class="skip-link" href="#collection">Skip to collection</a>
    <div class="page-shell">
      <header class="topbar">
        <span class="site-name">Suraj Dash</span>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light theme" title="Switch to light theme">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.6 14A8.8 8.8 0 0 1 10 3.4 8.8 8.8 0 1 0 20.6 14Z"></path></svg>
        </button>
      </header>

      <main>
        <header class="masthead">
          <div>
            <p class="eyebrow">Screening room</p>
            <h1>Cinema</h1>
          </div>
          <svg class="cinema-mark" width="68" height="50" viewBox="0 0 68 50" fill="none" aria-hidden="true"><rect x="1" y="1" width="66" height="48" rx="1" stroke="currentColor"/><path d="M10 1v48M58 1v48M1 11h9M1 21h9M1 30h9M1 40h9M58 11h9M58 21h9M58 30h9M58 40h9" stroke="currentColor"/><path d="m30 17 13 8-13 8V17Z" fill="currentColor"/></svg>
        </header>

        <div class="collection-navigation" id="collection-navigation" hidden>
          <nav class="status-tabs" aria-label="Collection status" id="status-tabs"></nav>
          <div class="collection-tools">
            <nav class="region-tabs" aria-label="Cinema region" id="region-tabs"></nav>
            <div class="search-sort">
              <label class="search-field">
                <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.7"></circle><path d="m12.7 12.7 4.4 4.4"></path></svg>
                <span class="sr-only">Search this collection</span>
                <input id="title-search" type="search" placeholder="Search this collection" autocomplete="off" spellcheck="false">
              </label>
              <label class="sort-field">
                <span class="sr-only">Sort collection</span>
                <select id="sort-select" aria-label="Sort collection">
                  <option value="title">Title A–Z</option>
                  <option value="year-desc">Year: newest</option>
                  <option value="year-asc">Year: oldest</option>
                </select>
              </label>
            </div>
          </div>
        </div>

        <div class="screening-room" id="screening-room" hidden>
          <aside class="collection-sidebar">
            <div class="sidebar-section">
              <h2>Browse</h2>
              <nav id="type-choices" aria-label="Types in this collection"></nav>
            </div>
            <div class="sidebar-section references" id="reference-section" hidden>
              <h2>Reference</h2>
              <nav id="reference-choices" aria-label="Reference collections"></nav>
            </div>
          </aside>

          <section class="collection" id="collection" aria-labelledby="collection-title" tabindex="-1">
            <label class="mobile-type-field" id="mobile-type-field">
              <span>Browse</span>
              <select id="type-select" aria-label="Choose a collection type"></select>
            </label>
            <header class="collection-heading">
              <div class="heading-path"><p id="collection-path"></p><h2 id="collection-title">Cinema</h2></div>
              <p class="result-count" id="result-count" aria-live="polite" aria-atomic="true"></p>
            </header>
            <ul class="poster-grid" id="poster-grid"></ul>
            <div class="empty-state" id="empty-state" hidden>
              <p id="empty-message">No entries match this search.</p>
              <button type="button" class="text-button" id="clear-search">Clear search</button>
            </div>
          </section>
        </div>

        <div class="load-state" id="load-state" role="status"><span class="loading-dot" aria-hidden="true"></span>Loading collection…</div>
        <noscript><p class="load-state">JavaScript is needed to browse this collection.</p></noscript>
      </main>

      <div class="source-line" id="source-line" hidden></div>
      <footer class="site-footer">
        <span>© 2026 Suraj Dash. All rights reserved.</span>
        <div><a href="https://surajdash-math.github.io/copyright/">Copyright</a><span class="footer-divider" aria-hidden="true">/</span><a href="#top">Back to top <span aria-hidden="true">↑</span></a></div>
      </footer>
    </div>

    <dialog id="detail-dialog" aria-labelledby="dialog-title">
      <form method="dialog" class="dialog-controls"><button type="submit" class="dialog-close" aria-label="Close details"><span>Close</span><span class="close-symbol" aria-hidden="true">×</span></button></form>
      <div id="dialog-content"></div>
    </dialog>
  </body>
</html>
